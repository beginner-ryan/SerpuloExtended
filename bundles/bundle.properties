block.serpuloex-solar-foundry.description = Fuses titanium, iron ingots, and gold ingots into solar alloy. Requires pyratite and power.
block.serpuloex-skyhammer-mortar.name = Skyhammer Mortar
block.serpuloex-skyhammer-mortar.description = Long-range artillery that launches explosive shells in a high arc. Its shells are intended to strike from above when roof mechanics are added.
