item.serpuloex-iron-ore.name = Iron Ore
item.serpuloex-iron-ore.description = A sturdy base ore. Smelt it into iron ingots.
item.serpuloex-iron-ingot.name = Iron Ingot
item.serpuloex-iron-ingot.description = A sturdy ingot for defensive structures and ammunition.
item.serpuloex-gold-ore.name = Gold Ore
item.serpuloex-gold-ore.description = A heavy, shiny ore. Smelt it into gold ingots.
item.serpuloex-gold-ingot.name = Gold Ingot
item.serpuloex-gold-ingot.description = A valuable ingot for advanced defenses and homing ammunition.

