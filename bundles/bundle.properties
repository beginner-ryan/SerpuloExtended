block.serpuloex-gold-wall-huge.name = Huge Gold Wall
block.serpuloex-gold-wall-huge.description = A massive wall made from gold ingots.

item.serpuloex-solar-alloy.name = Solar Alloy
item.serpuloex-solar-alloy.description = A rare alloy of titanium, iron, and gold. Used in advanced artillery.

