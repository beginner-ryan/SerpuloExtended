block.serpuloex-iron-forge.description = Smelts iron ore into iron ingots. Each ingot requires two ore and one coal.
block.serpuloex-gold-forge.name = Gold Forge
block.serpuloex-gold-forge.description = Smelts gold ore into gold ingots. Each ingot requires two ore and one coal.
block.serpuloex-iron-storm.name = Iron Storm
block.serpuloex-iron-storm.description = Fires ore and ingots. Iron ingots are fast and pierce targets; gold ingots home in on enemies.
