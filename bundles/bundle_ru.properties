item.serpuloex-iron-ore.name = Железная руда
item.serpuloex-iron-ore.description = Прочная базовая руда. Переплавляется в железные слитки.
item.serpuloex-iron-ingot.name = Железный слиток
item.serpuloex-iron-ingot.description = Прочный слиток для оборонительных построек и боеприпасов.
item.serpuloex-gold-ore.name = Золотая руда
item.serpuloex-gold-ore.description = Тяжёлая блестящая руда. Переплавляется в золотые слитки.
item.serpuloex-gold-ingot.name = Золотой слиток
item.serpuloex-gold-ingot.description = Ценный слиток для продвинутой обороны и самонаводящихся боеприпасов.

block.serpuloex-ore-iron.name = Железная руда
block.serpuloex-ore-iron.description = Залежи железной руды.
block.serpuloex-ore-gold.name = Золотая руда
block.serpuloex-ore-gold.description = Залежи золотой руды.
block.serpuloex-advanced-mechanical-drill.name = Продвинутый механический бур
block.serpuloex-advanced-mechanical-drill.description = Улучшенная версия механического бура. Добывает ресурсы вплоть до титана.
block.serpuloex-iron-forge.name = Железная кузница
block.serpuloex-iron-forge.description = Переплавляет железную руду в железные слитки. На каждый слиток нужны две руды и один уголь.
block.serpuloex-gold-forge.name = Золотая кузница
block.serpuloex-gold-forge.description = Переплавляет золотую руду в золотые слитки. На каждый слиток нужны две руды и один уголь.
block.serpuloex-iron-storm.name = Железный шторм
block.serpuloex-iron-storm.description = Стреляет рудами и слитками. Железные слитки быстры и пробивают цели, золотые — самонаводятся.
block.serpuloex-iron-wall.name = Железная стена
block.serpuloex-iron-wall.description = Надёжная стена из железных слитков.
block.serpuloex-iron-wall-large.name = Большая железная стена
block.serpuloex-iron-wall-large.description = Увеличенная и более прочная стена из железных слитков.
block.serpuloex-iron-wall-huge.name = Огромная железная стена
block.serpuloex-iron-wall-huge.description = Массивная стена из железных слитков.
block.serpuloex-gold-wall.name = Золотая стена
block.serpuloex-gold-wall.description = Прочная стена из золотых слитков.
block.serpuloex-gold-wall-large.name = Большая золотая стена
block.serpuloex-gold-wall-large.description = Увеличенная и прочная стена из золотых слитков.
block.serpuloex-gold-wall-huge.name = Огромная золотая стена
block.serpuloex-gold-wall-huge.description = Массивная стена из золотых слитков.

item.serpuloex-solar-alloy.name = Солнечный сплав
item.serpuloex-solar-alloy.description = Редкий сплав титана, железа и золота. Используется в продвинутой артиллерии.

block.serpuloex-solar-foundry.name = Солнечная литейная
block.serpuloex-solar-foundry.description = Сплавляет титан, железные и золотые слитки в солнечный сплав. Требует пиротит и энергию.
block.serpuloex-skyhammer-mortar.name = Небесный молот
block.serpuloex-skyhammer-mortar.description = Дальнобойная артиллерия, запускающая взрывные снаряды по высокой дуге. Её снаряды игнорируют силовые поля.
block.serpuloex-lead-wall.name = Свинцовая стена
block.serpuloex-lead-wall.description = Базовая стена из свинца.
block.serpuloex-lead-wall-large.name = Большая свинцовая стена
block.serpuloex-lead-wall-large.description = Увеличенная стена из свинца.
block.serpuloex-lead-wall-huge.name = Огромная свинцовая стена
block.serpuloex-lead-wall-huge.description = Массивная стена из свинца.
block.serpuloex-copper-wall-huge.name = Огромная медная стена
block.serpuloex-copper-wall-huge.description = Массивная стена из меди.
block.serpuloex-titanium-wall-huge.name = Огромная титановая стена
block.serpuloex-titanium-wall-huge.description = Массивная стена из титана.
block.serpuloex-plastanium-wall-huge.name = Огромная пластановая стена
block.serpuloex-plastanium-wall-huge.description = Массивная изолированная стена, поглощающая лазеры.
block.serpuloex-thorium-wall-huge.name = Огромная ториевая стена
block.serpuloex-thorium-wall-huge.description = Массивная стена из тория.
block.serpuloex-phase-wall-huge.name = Огромная фазовая стена
block.serpuloex-phase-wall-huge.description = Массивная стена, способная отражать летящие снаряды.
block.serpuloex-surge-wall-huge.name = Огромная кинетическая стена
block.serpuloex-surge-wall-huge.description = Массивная стена, выпускающая молнии при попадании.

block.serpuloex-iron-roof.name = Железная крыша
block.serpuloex-iron-roof.description = Прочная железная крыша. Редактируется только в режиме Roof Mode.
block.serpuloex-gold-roof.name = Золотая крыша
block.serpuloex-gold-roof.description = Прочная золотая крыша. Редактируется только в режиме Roof Mode.

